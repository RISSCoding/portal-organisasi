name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - run: bun install --frozen-lockfile
      - run: bun run test:unit

  test-rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - run: bun install --frozen-lockfile
      - run: bun run test:rls
        env:
          TESTCONTAINERS_RYUK_DISABLED: true

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - run: bun install --frozen-lockfile
      - run: bun run test:integration
        env:
          TESTCONTAINERS_RYUK_DISABLED: true

  test-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portal
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - run: bun install --frozen-lockfile

      # Jalankan migrasi database untuk E2E
      - run: bun run --filter '@portal/db' migrate
        env:
          DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/portal
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/portal

      # Install Playwright browser
      - run: bunx playwright install --with-deps chromium

      # Jalankan E2E Test
      - run: bun run test:e2e
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/portal
          DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/portal
          API_URL: http://localhost:3000
          WEB_URL: http://localhost:3001
